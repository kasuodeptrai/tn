<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>Trang chủ của tôi</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #ffffff;
      --text: #20242b;
      --muted: #7b8492;
      --line: #e9edf2;
      --accent: #3978e8;
      --accent-soft: #edf4ff;
      --shadow: 0 5px 20px rgba(25, 42, 70, .055);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      min-height: 100vh;
    }
    .page { width: min(1080px, 100%); margin: 0 auto; padding: 54px 28px 48px; }
    header { margin-bottom: 34px; }
    .eyebrow {
      color: var(--accent); font-size: 12px; font-weight: 700;
      letter-spacing: .12em; text-transform: uppercase; margin-bottom: 12px;
    }
    h1 { font-size: clamp(30px, 5vw, 42px); line-height: 1.15; margin: 0; letter-spacing: -.04em; }
    .subtitle { color: var(--muted); font-size: 15px; margin: 12px 0 0; line-height: 1.6; }
    .section-heading {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin: 0 0 16px;
    }
    .section-heading h2 { font-size: 16px; margin: 0; font-weight: 700; }
    .count { color: var(--muted); font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
    .tile {
      min-height: 154px; padding: 20px; border: 1px solid var(--line);
      border-radius: 17px; background: var(--surface); color: inherit;
      text-decoration: none; display: flex; flex-direction: column;
      align-items: flex-start; justify-content: space-between; gap: 20px;
      box-shadow: var(--shadow); transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .tile:hover { transform: translateY(-3px); border-color: #cbdcff; box-shadow: 0 9px 25px rgba(25, 42, 70, .09); }
    .tile:focus-visible { outline: 3px solid rgba(57,120,232,.3); outline-offset: 3px; }
    .tile-top { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
    .tile-top svg { width: 22px; height: 22px; }
    .tile-bottom { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .tile-title { font-size: 16px; font-weight: 650; line-height: 1.3; }
    .arrow { color: #9aa4b2; font-size: 20px; line-height: 1; }
    footer { margin-top: 34px; padding-top: 18px; border-top: 1px solid var(--line); color: #9aa2ad; font-size: 12px; }
    @media (max-width: 760px) {
      .page { padding: 36px 20px 30px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .tile { min-height: 140px; padding: 17px; border-radius: 15px; }
      .tile-title { font-size: 15px; }
    }
    @media (max-width: 360px) {
      .page { padding-left: 14px; padding-right: 14px; }
      .grid { gap: 9px; }
      .tile { min-height: 130px; padding: 14px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="eyebrow">MY SPACE</div>
      <h1>Không gian của tôi</h1>
      <p class="subtitle">Chọn một mục để mở trang bạn cần.</p>
    </header>

    <section aria-labelledby="pages-heading">
      <div class="section-heading">
        <h2 id="pages-heading">Các trang</h2>
        <span class="count" id="page-count"></span>
      </div>
      <div class="grid" id="page-grid"></div>
    </section>

    <footer>Trang chủ cá nhân</footer>
  </main>

  <script>
    // THÊM TRANG MỚI Ở ĐÂY:
    // { title: "Tên trang", url: "duong-dan.html", icon: "book" }
    // Nếu là website bên ngoài, dùng URL đầy đủ, ví dụ: https://example.com
    const pages = [
      { title: "Trắc nghiệm 270 câu", url: "tracnghiem270.html", icon: "grid" },
      { title: "Trắc nghiệm 92 câu", url: "tracnghiem92cau.html", icon: "book" },
      { title: "Trang 3", url: "#", icon: "folder" },
      { title: "Trang 4", url: "#", icon: "globe" },
      { title: "Trang 5", url: "#", icon: "file" },
      { title: "Trang 6", url: "#", icon: "calendar" }
    ];

    const icons = {
      grid: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
      book: '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v17H6.5A2.5 2.5 0 0 0 4 22z"/><path d="M4 5.5v14A2.5 2.5 0 0 1 6.5 17H20M8 7h8"/>',
      folder: '<path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
      globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/>',
      file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/>',
      calendar: '<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>'
    };

    const grid = document.getElementById('page-grid');
    pages.forEach((page) => {
      const link = document.createElement('a');
      link.className = 'tile';
      link.href = page.url;
      link.innerHTML = `
        <span class="tile-top" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${icons[page.icon] || icons.grid}</svg>
        </span>
        <span class="tile-bottom"><span class="tile-title"></span><span class="arrow" aria-hidden="true">↗</span></span>`;
      link.querySelector('.tile-title').textContent = page.title;
      if (page.url !== '#') {
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
      } else {
        link.addEventListener('click', (event) => event.preventDefault());
        link.setAttribute('aria-label', page.title + ' — chưa thêm đường dẫn');
      }
      grid.appendChild(link);
    });
    document.getElementById('page-count').textContent = `${pages.length} mục`;
  </script>
</body>
</html>
