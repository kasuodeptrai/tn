        q: "Theo quan điểm triết học Mác - Lênin, giữa cá nhân và xã hội có quan hệ với nhau như thế nào? Chọn phương án sai:",
        opts: {
          a: "Cá nhân và xã hội không tách rời nhau",
          b: "Quan hệ cá nhân - xã hội là tất yếu, là tiền đề và điều kiện tồn tại và phát triển của nhau",
          c: "Cá nhân và xã hội vừa thống nhất vừa mâu thuẫn",
          d: "Cá nhân và xã hội thống nhất với nhau một cách tuyệt đối"
        },
        ans: "d",
        whyRight: "Sự thống nhất giữa cá nhân và xã hội chỉ mang tính lịch sử, tương đối; giữa lợi ích cá nhân và lợi ích xã hội có thể xuất hiện mâu thuẫn cần điều hòa.",
        whyWrong: "A, B, C đều đúng theo quan hệ biện chứng giữa cá nhân và xã hội."
      },
      {
        stt: 92,
        q: "Theo quan điểm của chủ nghĩa Mác - Lênin, cách mạng là sự nghiệp của ai?",
        opts: {
          a: "Giai cấp nông dân",
          b: "Giai cấp công nhân",
          c: "Giai cấp tư sản",
          d: "Quần chúng nhân dân"
        },
        ans: "d",
        whyRight: "Theo quan điểm duy vật lịch sử, quần chúng nhân dân là chủ thể sáng tạo lịch sử và là lực lượng quyết định làm nên cách mạng xã hội.",
        whyWrong: "Các giai cấp đơn lẻ như nông dân, công nhân hay tư sản không thay thế được vai trò nền tảng và đông đảo của quần chúng nhân dân trong cách mạng xã hội."
      }
    ];

    const QUESTIONS_PER_ROUND = 20;

    /**
     * Xây dựng danh sách 5 đề cho bộ 92 câu theo đúng số thứ tự gốc 1..92:
     * Đề 1..4: mỗi đề 20 câu (stt 1..20, 21..40, 41..60, 61..80)
     * Đề 5: 12 câu còn lại (stt 81..92)
     */
    function buildDecks92() {
      const decks = [];
      let deckNo = 1;
      for (let start = 0; start < QUESTION_BANK_92.length; start += QUESTIONS_PER_ROUND) {
        const slice = QUESTION_BANK_92.slice(start, start + QUESTIONS_PER_ROUND).map((item, idx) => ({
          ...item,
          stt: start + idx + 1
        }));
        decks.push({
          deckNo,
          startStt: slice[0].stt,
          endStt: slice[slice.length - 1].stt,
          questions: slice
        });
        deckNo += 1;
      }
      return decks;
    }

    const DECKS_92 = buildDecks92();

    let state = {
      mode: 'random20', // 'random20' | 'deck'
      activeDeckNo: null,
      roundQuestions: [],
      currentIndex: 0,
      score: 0,
      correctCount: 0,
      wrongCount: 0,
      answersByIndex: {}, // Lưu trạng thái { [idx]: { chosen, isCorrect } } để bấm mục lục xem lại vẫn chuẩn
      selectedOption: null,
      answered: false
    };

    /**
     * Trộn ngẫu nhiên mảng bằng thuật toán Fisher-Yates
     */
    function shuffleArray(list) {
      const arr = list.slice();
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    /**
     * Khởi tạo màn chơi mới gồm 20 câu ngẫu nhiên từ bộ 92 câu
     */
    function startNewRound() {
      const picked = shuffleArray(QUESTION_BANK_92).slice(0, QUESTIONS_PER_ROUND);
      state = {
        mode: 'random20',
        activeDeckNo: null,
        roundQuestions: picked,
        currentIndex: 0,
        score: 0,
        correctCount: 0,
        wrongCount: 0,
        answersByIndex: {},
        selectedOption: null,
        answered: false
      };
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /**
     * Chọn ngẫu nhiên một đề từ Đề 1 đến Đề 5 (Đề 5 có 12 câu: stt 81..92)
     */
    function startRandomDeck() {
      const randomDeck = DECKS_92[Math.floor(Math.random() * DECKS_92.length)];
      startSpecificDeck(randomDeck.deckNo);
    }

    /**
     * Khởi chạy màn chơi theo số thứ tự đề cụ thể (1..5)
     */
    function startSpecificDeck(deckNo) {
      const targetDeck = DECKS_92.find((d) => d.deckNo === deckNo);
      if (!targetDeck) return;
      state = {
        mode: 'deck',
        activeDeckNo: targetDeck.deckNo,
        roundQuestions: targetDeck.questions.slice(),
        currentIndex: 0,
        score: 0,
        correctCount: 0,
        wrongCount: 0,
        answersByIndex: {},
        selectedOption: null,
        answered: false
      };
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /**
     * Render thanh công cụ chọn đề trực tiếp (Đề 1 đến Đề 5)
     */
    function renderDeckSelectorBar() {
      const bar = document.getElementById('deck-selector-bar');
      if (!bar) return;

      bar.innerHTML = DECKS_92.map((deck) => {
        const isActive = state.mode === 'deck' && state.activeDeckNo === deck.deckNo;
        const activeClass = isActive
          ? 'bg-indigo-600 text-white border-indigo-700 shadow-2xs'
          : 'bg-white text-slate-700 border-slate-200 hover:border-indigo-300';

        return `
          <button
            type="button"
            data-deck="${deck.deckNo}"
            class="deck-pick-btn shrink-0 px-2.5 py-1.5 rounded-xl border text-[11px] font-bold transition-all ${activeClass}"
            title="Đề ${deck.deckNo} (stt ${deck.startStt}–${deck.endStt} · ${deck.questions.length} câu)"
          >
            Đề ${deck.deckNo} <span class="opacity-80 font-semibold">(${deck.questions.length})</span>
          </button>
        `;
      }).join('');

      bar.querySelectorAll('.deck-pick-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const pickedNo = Number(btn.getAttribute('data-deck'));
          startSpecificDeck(pickedNo);
        });
      });

      const activeBtn = bar.querySelector(`[data-deck="${state.activeDeckNo}"]`);
      if (activeBtn) {
        activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      }
    }

    /**
     * Nhảy trực tiếp tới một câu thông qua mục lục đáp án trên top
     */
    function jumpToQuestion(targetIndex) {
      if (targetIndex < 0 || targetIndex >= state.roundQuestions.length) return;
      state.currentIndex = targetIndex;
      const saved = state.answersByIndex[targetIndex];
      if (saved) {
        state.answered = true;
        state.selectedOption = saved.chosen;
      } else {
        state.answered = false;
        state.selectedOption = null;
      }
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /**
     * Xử lý khi người dùng chạm vào một đáp án
     */
    function handleSelectOption(optKey) {
      if (state.answered) return;
      const item = state.roundQuestions[state.currentIndex];
      const isCorrect = optKey === item.ans;

      state.answered = true;
      state.selectedOption = optKey;

      if (isCorrect) {
        state.score += 1;
        state.correctCount += 1;
        playFeedbackSound(true);
      } else {
        state.score -= 1;
        state.wrongCount += 1;
        playFeedbackSound(false);
      }

      state.answersByIndex[state.currentIndex] = {
        chosen: optKey,
        isCorrect
      };

      render();
    }

    /**
     * Phát âm thanh phản hồi đúng/sai bằng Web Audio API:
     * - Đúng: tiếng chuông "correct ding" trong trẻo, ngân vang
     * - Sai: tiếng "wrong buzzer" trầm rè đặc trưng của game show
     */
    function playFeedbackSound(isCorrect) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;

        if (!window.__quizAudioCtx) {
          window.__quizAudioCtx = new AudioCtx();
        }
        const ctx = window.__quizAudioCtx;
        if (ctx.state === 'suspended') {
          ctx.resume();
        }

        const now = ctx.currentTime;
        if (isCorrect) {
          // Hiệu ứng "Correct Ding": chuông ngân hai tầng tần số sáng và vang
          const harmonics = [
            { freq: 987.77, gain: 0.22, duration: 0.65 },  // B5 (nốt chính)
            { freq: 1318.51, gain: 0.14, duration: 0.72 }, // E6 (quãng 4 ngân sáng)
            { freq: 1975.53, gain: 0.06, duration: 0.45 }  // B6 (hài âm chuông)
          ];

          harmonics.forEach((tone, index) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const startTime = now + (index === 1 ? 0.065 : 0);

            osc.type = 'sine';
            osc.frequency.setValueAtTime(tone.freq, startTime);

            gain.gain.setValueAtTime(0.0001, startTime);
            gain.gain.exponentialRampToValueAtTime(tone.gain, startTime + 0.012);
            gain.gain.exponentialRampToValueAtTime(0.0001, startTime + tone.duration);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start(startTime);
            osc.stop(startTime + tone.duration + 0.02);
          });
        } else {
          // Hiệu ứng "Wrong Buzzer": hai sóng răng cưa lệch pha nhẹ tạo tiếng rè trầm đặc trưng
          const buzzerFreqs = [138.59, 146.83]; // C#3 & D3 tạo độ rung buzzer rõ rệt
          buzzerFreqs.forEach((baseFreq) => {
            const osc = ctx.createOscillator();
            const filter = ctx.createBiquadFilter();
            const gain = ctx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(baseFreq, now);
            osc.frequency.linearRampToValueAtTime(baseFreq * 0.88, now + 0.48);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(750, now);
            filter.frequency.linearRampToValueAtTime(420, now + 0.48);

            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.linearRampToValueAtTime(0.13, now + 0.02);
            gain.gain.setValueAtTime(0.12, now + 0.36);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);

            osc.start(now);
            osc.stop(now + 0.52);
          });
        }
      } catch (err) {
        // Bỏ qua nếu thiết bị chặn âm thanh
      }
    }

    /**
     * Chuyển sang câu kế tiếp hoặc màn tổng kết
     */
    function handleNext() {
      if (state.currentIndex < state.roundQuestions.length - 1) {
        jumpToQuestion(state.currentIndex + 1);
      } else {
        state.currentIndex = state.roundQuestions.length; // Trạng thái kết thúc màn
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    /**
     * Render mục lục đáp án tương tác cố định trên top
     */
    function renderAnswerIndexBar() {
      const bar = document.getElementById('answer-index-bar');
      if (!bar) return;

      const total = state.roundQuestions.length;
      const isFinished = state.currentIndex >= total;

      const chipsHtml = state.roundQuestions.map((qItem, idx) => {
        const record = state.answersByIndex[idx];
        const isCurrent = !isFinished && idx === state.currentIndex;

        let chipStyle = 'bg-slate-100 text-slate-700 border-slate-200 hover:border-indigo-300';
        let subLabel = '—';

        if (record) {
          if (record.isCorrect) {
            chipStyle = 'bg-emerald-500 text-white border-emerald-600 shadow-2xs';
            subLabel = qItem.ans.toUpperCase();
          } else {
            chipStyle = 'bg-rose-500 text-white border-rose-600 shadow-2xs';
            subLabel = `${record.chosen.toUpperCase()}→${qItem.ans.toUpperCase()}`;
          }
        }

        const ringClass = isCurrent ? 'ring-2 ring-indigo-600 ring-offset-1 scale-105' : '';

        return `
          <button
            type="button"
            data-jump="${idx}"
            class="toc-chip shrink-0 min-w-[44px] px-2 py-1 rounded-xl border text-center transition-all flex flex-col items-center justify-center ${chipStyle} ${ringClass}"
            title="Câu ${idx + 1} (stt đề 92: ${qItem.stt})"
          >
            <span class="text-[11px] font-extrabold leading-none">${idx + 1}</span>
            <span class="text-[9.5px] font-semibold opacity-95 leading-tight mt-0.5">${subLabel}</span>
          </button>
        `;
      }).join('');

      const summaryChipClass = isFinished
        ? 'bg-indigo-600 text-white border-indigo-700 ring-2 ring-indigo-600 ring-offset-1'
        : 'bg-indigo-50 text-indigo-700 border-indigo-200 hover:bg-indigo-100';

      bar.innerHTML = `
        ${chipsHtml}
        <button
          id="toc-summary-btn"
          type="button"
          class="shrink-0 px-2.5 py-1 rounded-xl border text-[11px] font-bold transition-all ${summaryChipClass}"
        >
          Tổng kết
        </button>
      `;

      bar.querySelectorAll('.toc-chip').forEach((chip) => {
        chip.addEventListener('click', () => {
          const target = Number(chip.getAttribute('data-jump'));
          jumpToQuestion(target);
        });
      });

      const tocSummaryBtn = document.getElementById('toc-summary-btn');
      if (tocSummaryBtn) {
        tocSummaryBtn.addEventListener('click', () => {
          state.currentIndex = state.roundQuestions.length;
          render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      }

      // Cuộn chip câu hiện tại vào giữa thanh mục lục
      const activeChip = bar.querySelector(`[data-jump="${state.currentIndex}"]`);
      if (activeChip) {
        activeChip.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      }
    }

    /**
     * Cập nhật thanh tiến độ, tên đề và điểm số ở header
     */
    function updateHeader() {
      const scoreEl = document.getElementById('score-value');
      const badgeEl = document.getElementById('score-badge');
      const progressText = document.getElementById('progress-text');
      const statSummary = document.getElementById('stat-summary');
      const progressBar = document.getElementById('progress-bar');
      const deckLabel = document.getElementById('deck-label');

      const total = state.roundQuestions.length;
      if (state.mode === 'deck' && state.activeDeckNo) {
        deckLabel.textContent = `Đề ${state.activeDeckNo} / 5 (stt ${state.roundQuestions[0].stt}–${state.roundQuestions[total - 1].stt} · ${total} câu)`;
      } else {
        deckLabel.textContent = `Đề Gốc 92 Câu · 20 Câu Ngẫu Nhiên`;
      }

      scoreEl.textContent = state.score > 0 ? `+${state.score}` : `${state.score}`;
      badgeEl.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-2xl shrink-0 border transition-colors ' + (
        state.score > 0
          ? 'bg-emerald-50 border-emerald-200 text-emerald-900'
          : state.score < 0
            ? 'bg-rose-50 border-rose-200 text-rose-900'
            : 'bg-indigo-50 border-indigo-200/80 text-indigo-950'
      );

      const isFinished = state.currentIndex >= total;
      const answeredCount = Object.keys(state.answersByIndex).length;
      if (isFinished) {
        progressText.textContent = `Hoàn tất ${total} / ${total} câu`;
        progressBar.style.width = `100%`;
      } else {
        progressText.textContent = `Câu ${state.currentIndex + 1} / ${total}`;
        const pct = (answeredCount / total) * 100;
        progressBar.style.width = `${Math.max(5, pct)}%`;
      }

      statSummary.textContent = `Đúng: ${state.correctCount} · Sai: ${state.wrongCount}`;
      renderDeckSelectorBar();
      renderAnswerIndexBar();
    }

    /**
     * Render giao diện câu hỏi hoặc tổng kết màn chơi
     */
    function render() {
      updateHeader();
      const main = document.getElementById('main-content');
      const total = state.roundQuestions.length;

      if (state.currentIndex >= total) {
        renderSummary(main);
        return;
      }

      const item = state.roundQuestions[state.currentIndex];
      const isCorrectUser = state.answered && state.selectedOption === item.ans;

      const optionKeys = ['a', 'b', 'c', 'd'];
      const optionsHtml = optionKeys.map((key) => {
        const label = item.opts[key];
        let btnClass = 'bg-white border-slate-200/90 text-slate-800 hover:border-indigo-300 active:scale-[0.99] shadow-xs';
        let circleClass = 'bg-slate-100 text-slate-700 border-slate-200';
        let statusTag = '';

        if (state.answered) {
          if (key === item.ans) {
            // Ô đáp án đúng luôn nổi bật màu xanh khi đã trả lời
            btnClass = 'bg-emerald-50 border-2 border-emerald-500 text-emerald-950 shadow-sm';
            circleClass = 'bg-emerald-600 text-white border-emerald-600';
            statusTag = `<span class="ml-auto shrink-0 text-[11px] font-bold px-2 py-0.5 rounded-full bg-emerald-600 text-white">Đúng</span>`;
          } else if (key === state.selectedOption && key !== item.ans) {
            // Ô người dùng bấm sai chuyển màu đỏ
            btnClass = 'bg-rose-50 border-2 border-rose-500 text-rose-950 shadow-sm';
            circleClass = 'bg-rose-600 text-white border-rose-600';
            statusTag = `<span class="ml-auto shrink-0 text-[11px] font-bold px-2 py-0.5 rounded-full bg-rose-600 text-white">Bạn chọn</span>`;
          } else {
            btnClass = 'bg-white/65 border-slate-200/60 text-slate-400 opacity-75';
            circleClass = 'bg-slate-100 text-slate-400 border-slate-200';
          }
        }

        return `
          <button
            type="button"
            data-opt="${key}"
            ${state.answered ? 'disabled' : ''}
            class="opt-btn w-full text-left rounded-2xl border p-3.5 min-h-[60px] flex items-start gap-3 transition-all duration-150 ${btnClass}"
          >
            <span class="w-7 h-7 rounded-xl border font-bold text-xs uppercase flex items-center justify-center shrink-0 mt-0.5 ${circleClass}">
              ${key}
            </span>
            <span class="text-[15px] leading-snug font-medium flex-1">${escapeHtml(label)}</span>
            ${statusTag}
          </button>
        `;
      }).join('');

      let explanationHtml = '';
      if (state.answered) {
        if (isCorrectUser) {
          explanationHtml = `
            <div class="animate-pop mt-3.5 rounded-2xl bg-emerald-50/95 border border-emerald-200 p-4 shadow-xs">
              <div class="flex items-center justify-between gap-2 mb-1.5">
                <span class="inline-flex items-center gap-1.5 text-sm font-extrabold text-emerald-800">
                  <span>✓</span> Chính xác!
                </span>
                <span class="text-xs font-extrabold px-2.5 py-1 rounded-full bg-emerald-600 text-white">+1 điểm</span>
              </div>
              <p class="text-[13.5px] leading-relaxed text-emerald-950">
                <strong class="font-bold">Giải thích đúng:</strong> ${escapeHtml(item.whyRight)}
              </p>
            </div>
          `;
        } else {
          explanationHtml = `
            <div class="animate-pop mt-3.5 rounded-2xl bg-rose-50/95 border border-rose-200 p-4 shadow-xs">
              <div class="flex items-center justify-between gap-2 mb-1.5">
                <span class="inline-flex items-center gap-1.5 text-sm font-extrabold text-rose-800">
                  <span>✕</span> ÈEE
                </span>
                <span class="text-xs font-extrabold px-2.5 py-1 rounded-full bg-rose-600 text-white">-1 điểm</span>
              </div>
              <p class="text-[13.5px] leading-relaxed text-rose-950 mb-2">
                <strong class="font-bold">Tại sao sai:</strong> ${escapeHtml(item.whyWrong)}
              </p>
              <div class="pt-2 border-t border-rose-200/80 text-[13.5px] leading-relaxed text-emerald-950 bg-emerald-50/80 -mx-1 px-2.5 py-2 rounded-xl">
                <strong class="font-bold text-emerald-800">Đáp án đúng là ${item.ans.toUpperCase()}:</strong> ${escapeHtml(item.whyRight)}
              </div>
            </div>
          `;
        }
      }

      const nextLabel = state.currentIndex === total - 1
        ? 'Xem kết quả màn chơi'
        : 'Câu tiếp theo →';

      main.innerHTML = `
        <div class="animate-pop flex-1 flex flex-col">
          <!-- Thẻ câu hỏi -->
          <section class="bg-white rounded-3xl border border-slate-200/85 shadow-xs p-4 mb-3">
            <div class="flex items-center justify-between gap-2 mb-2.5">
              <span class="inline-flex items-center px-2.5 py-1 rounded-xl bg-indigo-600 text-white text-xs font-bold tracking-wide">
                stt đề 92: Câu ${item.stt}
              </span>
              <span class="text-[11px] font-semibold text-slate-400">Câu ${state.currentIndex + 1}/${total}</span>
            </div>
            <h2 class="text-[16px] sm:text-[17px] font-bold leading-snug text-slate-900">
              ${escapeHtml(item.q)}
            </h2>
          </section>

          <!-- Danh sách 4 đáp án to dễ bấm -->
          <section class="space-y-2.5">
            ${optionsHtml}
          </section>

          <!-- Khung giải thích đúng / sai -->
          ${explanationHtml}
        </div>

        <!-- Nút điều hướng cố định hợp lý cuối màn hình -->
        <div class="mt-4 pt-1">
          <button
            id="next-btn"
            type="button"
            ${state.answered ? '' : 'disabled'}
            class="w-full py-3.5 px-5 rounded-2xl font-bold text-[15px] transition-all flex items-center justify-center gap-2 ${
              state.answered
                ? 'bg-slate-900 text-white shadow-md hover:bg-slate-800 active:scale-[0.99]'
                : 'bg-slate-200 text-slate-400 cursor-not-allowed'
            }"
          >
            ${nextLabel}
          </button>
        </div>
      `;

      // Gắn sự kiện click cho các nút đáp án
      main.querySelectorAll('.opt-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const key = btn.getAttribute('data-opt');
          handleSelectOption(key);
        });
      });

      // Gắn sự kiện nút câu tiếp theo
      const nextBtn = document.getElementById('next-btn');
      if (nextBtn && state.answered) {
        nextBtn.addEventListener('click', handleNext);
      }
    }

    /**
     * Render màn tổng kết sau khi hoàn thành màn chơi
     */
    function renderSummary(main) {
      const total = state.roundQuestions.length;
      const accuracy = total > 0 ? Math.round((state.correctCount / total) * 100) : 0;
      const deckTitle = state.mode === 'deck' && state.activeDeckNo
        ? `Đề ${state.activeDeckNo} / 5 (${total} câu)`
        : `Màn ${total} Câu Ngẫu Nhiên`;

      const historyRows = state.roundQuestions.map((qItem, idx) => {
        const rec = state.answersByIndex[idx];
        const chosenText = rec ? rec.chosen.toUpperCase() : 'Chưa làm';
        const isCorrect = rec ? rec.isCorrect : false;

        const badge = !rec
          ? `<span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">Chưa làm</span>`
          : isCorrect
            ? `<span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800">+1đ</span>`
            : `<span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-rose-100 text-rose-800">-1đ</span>`;

        return `
          <div class="p-3 rounded-2xl border ${!rec ? 'bg-slate-50/50 border-slate-200/80' : isCorrect ? 'bg-emerald-50/40 border-emerald-200/80' : 'bg-rose-50/40 border-rose-200/80'}">
            <div class="flex items-center justify-between gap-2 mb-1">
              <button type="button" data-review="${idx}" class="review-jump text-xs font-bold text-indigo-700 underline underline-offset-2 text-left">
                Câu ${idx + 1} · stt đề 92: Câu ${qItem.stt}
              </button>
              ${badge}
            </div>
            <p class="text-xs font-semibold text-slate-800 leading-snug mb-1.5">${escapeHtml(qItem.q)}</p>
            <div class="text-[11.5px] text-slate-600 space-y-0.5">
              <div>Bạn chọn: <strong class="${!rec ? 'text-slate-600' : isCorrect ? 'text-emerald-700' : 'text-rose-700'} uppercase">${chosenText}</strong> · Đáp án đúng: <strong class="text-emerald-700 uppercase">${qItem.ans}</strong></div>
              <p class="text-slate-700 leading-relaxed pt-1">
                ${isCorrect ? escapeHtml(qItem.whyRight) : escapeHtml(qItem.whyWrong)}
              </p>
            </div>
          </div>
        `;
      }).join('');

      main.innerHTML = `
        <div class="animate-pop space-y-3.5">
          <section class="bg-white rounded-3xl border border-slate-200/85 p-5 text-center shadow-xs">
            <span class="inline-block text-xs font-bold uppercase tracking-wider px-3 py-1 rounded-full bg-indigo-50 text-indigo-700 mb-2">
              ${escapeHtml(deckTitle)}
            </span>
            <h2 class="text-xl font-extrabold text-slate-900 mb-1">Tổng Kết Điểm Số</h2>
            <p class="text-xs text-slate-500 mb-4">Bộ đề gốc 92 câu · Triết học Mác - Lênin</p>

            <div class="grid grid-cols-3 gap-2 mb-4">
              <div class="rounded-2xl bg-slate-50 border border-slate-200/70 p-2.5">
                <div class="text-[11px] font-medium text-slate-500">Tổng điểm</div>
                <div class="text-lg font-extrabold text-indigo-700">${state.score > 0 ? `+${state.score}` : state.score}</div>
              </div>
              <div class="rounded-2xl bg-emerald-50 border border-emerald-200/70 p-2.5">
                <div class="text-[11px] font-medium text-emerald-700">Câu đúng</div>
                <div class="text-lg font-extrabold text-emerald-700">${state.correctCount}/${total}</div>
              </div>
              <div class="rounded-2xl bg-rose-50 border border-rose-200/70 p-2.5">
                <div class="text-[11px] font-medium text-rose-700">Câu sai</div>
                <div class="text-lg font-extrabold text-rose-700">${state.wrongCount}/${total}</div>
              </div>
            </div>

            <p class="text-xs font-semibold text-slate-600 mb-4">Độ chính xác: <span class="text-slate-900">${accuracy}%</span></p>

            <div class="grid grid-cols-1 gap-2">
              <button
                id="restart-btn"
                type="button"
                class="w-full py-3.5 px-5 rounded-2xl bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-bold text-[15px] shadow-md transition-all"
              >
                Chơi Màn 20 Câu Ngẫu Nhiên Mới
              </button>
              <button
                id="summary-random-deck-btn"
                type="button"
                class="w-full py-3 px-5 rounded-2xl bg-slate-900 hover:bg-slate-800 active:scale-[0.99] text-white font-bold text-sm transition-all"
              >
                📑 Bốc Ngẫu Nhiên Đề Khác (Đề 1–5)
              </button>
            </div>
          </section>

          <section class="bg-white rounded-3xl border border-slate-200/85 p-4 shadow-xs">
            <h3 class="text-sm font-bold text-slate-900 mb-3">Chi Tiết Từng Câu</h3>
            <div class="space-y-2.5 max-h-[420px] overflow-y-auto pr-0.5">
              ${historyRows}
            </div>
          </section>
        </div>
      `;

      document.getElementById('restart-btn').addEventListener('click', startNewRound);
      document.getElementById('summary-random-deck-btn').addEventListener('click', startRandomDeck);
      main.querySelectorAll('.review-jump').forEach((btn) => {
        btn.addEventListener('click', () => {
          jumpToQuestion(Number(btn.getAttribute('data-review')));
        });
      });
    }

    /**
     * Chống XSS khi chèn văn bản vào HTML
     */
    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showRuntimeError(err) {
      const main = document.getElementById('main-content');
      if (!main) return;
      const message = err && err.message ? err.message : String(err || 'Lỗi không xác định');
      main.innerHTML = `
        <div class="rounded-3xl bg-rose-50 border border-rose-200 p-4 text-rose-950 shadow-xs">
          <div class="text-sm font-extrabold text-rose-800 mb-1">Đã xảy ra lỗi hiển thị</div>
          <p class="text-xs leading-relaxed mb-3">${escapeHtml(message)}</p>
          <button
            id="btn-retry-error"
            type="button"
            class="px-3.5 py-2 rounded-xl bg-rose-700 text-white text-xs font-bold hover:bg-rose-800 transition-all"
          >
            Tải lại màn chơi
          </button>
        </div>
      `;
      const retryBtn = document.getElementById('btn-retry-error');
      if (retryBtn) {
        retryBtn.addEventListener('click', () => {
          try {
            startNewRound();
          } catch (innerErr) {
            console.error(innerErr);
          }
        });
      }
    }

    window.addEventListener('error', (event) => {
      if (event && event.error) {
        showRuntimeError(event.error);
      }
    });

    window.addEventListener('unhandledrejection', (event) => {
      showRuntimeError(event && event.reason ? event.reason : 'Promise bị từ chối');
    });

    // Khởi chạy ứng dụng và gắn sự kiện nút trên thanh đầu
    window.addEventListener('DOMContentLoaded', () => {
      try {
        document.getElementById('btn-random-20').addEventListener('click', startNewRound);
        document.getElementById('btn-random-deck').addEventListener('click', startRandomDeck);
        startNewRound();
      } catch (err) {
        showRuntimeError(err);
      }
    });
  </script>
</body>
</html>
